name: Apply ITSM v2 integration payload

on:
  push:
    branches:
      - agent/itsm-ticket-capability-framework-v2
    paths:
      - .github/workflows/agent-apply-itsm-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/itsm-ticket-capability-framework-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/itsm-ticket-capability-framework-v2
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reconstruct implementation payload
        shell: bash
        run: |
          set -euo pipefail
          fetch_chunk() {
            local sha="$1"
            local target="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> "$target"
          }
          : > /tmp/implementation.b64
          for sha in \
            babd139a94db8f15ba0ddfc50db1a101ab99dd32 \
            35af30f4ef9dacc4df07b144251a1a47e5c042ee \
            87266a5c1a2851431a096912f41e389f30410c44 \
            e37e7f95dcfa8ae87adae41cc317231a0c367897 \
            5c8454e2b87d3b24002909fa3c5000c13c0c40a0 \
            7cfef41a7383bd5b93f24c5903ac5dca67d57ddd \
            0b624ab7874057b65369b1f9e0fd4f9c76f0b0fb \
            73f540659f8d271227884e2018ed7f60f67fa300 \
            116deab47a7b37b005179e674fe70b03147e24e1
          do
            fetch_chunk "$sha" /tmp/implementation.b64
          done
          base64 --decode /tmp/implementation.b64 > /tmp/implementation.tar.gz
          gzip -t /tmp/implementation.tar.gz
          tar -xzf /tmp/implementation.tar.gz -C .
          rm -f .github/workflows/agent-export-v2-source.yml
          git add -A
          git commit -m "feat: integrate ITSM framework on density baseline"
      - name: Reconstruct test payload
        shell: bash
        run: |
          set -euo pipefail
          fetch_chunk() {
            local sha="$1"
            local target="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> "$target"
          }
          : > /tmp/tests.b64
          fetch_chunk e8f6fe7205f2a4e0d2f437829f29b6a9d75ebcd8 /tmp/tests.b64
          fetch_chunk f85c4e01b2eb46459fc97fd23137e3d94d994896 /tmp/tests.b64
          base64 --decode /tmp/tests.b64 > /tmp/tests.tar.gz
          gzip -t /tmp/tests.tar.gz
          tar -xzf /tmp/tests.tar.gz -C .
          git add -A
          git commit -m "test: add ITSM v2 integration and visual gates"
      - name: Reconstruct documentation payload
        shell: bash
        run: |
          set -euo pipefail
          fetch_chunk() {
            local sha="$1"
            local target="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> "$target"
          }
          : > /tmp/docs.b64
          fetch_chunk 3bb74c0990177a1f9a43c9e5b13fb5bb573c0dc7 /tmp/docs.b64
          fetch_chunk bc5d4db71f98d260256cc7540a1429ae38328885 /tmp/docs.b64
          base64 --decode /tmp/docs.b64 > /tmp/docs.tar.gz
          gzip -t /tmp/docs.tar.gz
          tar -xzf /tmp/docs.tar.gz -C .
          git add -A
          git commit -m "docs: record ITSM v2 integration contract"
      - name: Remove one-shot workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-apply-itsm-v2.yml
          git add -A
          git commit -m "chore: remove one-shot integration workflow"
          git push origin "HEAD:${TARGET_BRANCH}"
