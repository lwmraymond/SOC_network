name: Agent final EUI candidate validation

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - reopened

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out disposable branch state
        uses: actions/checkout@v4
        with:
          ref: codex/kibana-42page-visual
          fetch-depth: 0

      - name: Restore verified source and assemble candidate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/audit-eui-visual-metrics.mjs /tmp/audit-eui-visual-metrics.mjs
          cp src/pages/P41AuthenticationLdapSso.tsx /tmp/P41AuthenticationLdapSso.tsx
          git reset --hard f351391910c627b01f36bbb819f7eb50ce395181
          cp /tmp/audit-eui-visual-metrics.mjs scripts/audit-eui-visual-metrics.mjs
          cp /tmp/P41AuthenticationLdapSso.tsx src/pages/P41AuthenticationLdapSso.tsx
          cat >> src/styles-kibana-fidelity.css <<'CSS'

          /* Audit-backed typography and density refinements. */
          .prototypePage .euiPageTemplate__header,
          .workflowPage .euiPageTemplate__header {
            min-height: 80px !important;
            padding: 12px 20px !important;
          }

          .prototypePage .euiPageTemplate__header h1,
          .workflowPage .euiPageTemplate__header h1 {
            margin: 0 !important;
            font-size: 24px !important;
            line-height: 32px !important;
          }

          .prototypePage .euiPageTemplate__header [class*='description'],
          .workflowPage .euiPageTemplate__header [class*='description'] {
            margin: 4px 0 0 !important;
            font-size: 13px !important;
            line-height: 20px !important;
          }

          .prototypePage h2.euiTitle,
          .workflowPage h2.euiTitle { font-size: 16px !important; line-height: 24px !important; }
          .prototypePage h3.euiTitle,
          .workflowPage h3.euiTitle { font-size: 14px !important; line-height: 20px !important; }

          .prototypePage p:not(.euiTitle),
          .workflowPage p:not(.euiTitle),
          .prototypePage li,
          .workflowPage li,
          .prototypePage dd,
          .workflowPage dd {
            font-size: 13px;
            line-height: 20px !important;
          }

          .prototypePage :is(dt, label, .euiFormLabel),
          .workflowPage :is(dt, label, .euiFormLabel) {
            font-size: 12px;
            line-height: 16px !important;
          }

          .prototypePage :is(small, .euiText--extraSmall),
          .workflowPage :is(small, .euiText--extraSmall) {
            font-size: 11px;
            line-height: 16px !important;
          }

          .prototypePage .euiStat__title,
          .workflowPage .euiStat__title {
            height: auto !important;
            overflow: visible !important;
            line-height: 1.2 !important;
          }

          .prototypePage .euiStat__description,
          .workflowPage .euiStat__description { font-size: 12px; line-height: 16px !important; }

          .prototypePage table th,
          .workflowPage table th,
          .p07Frame table th {
            height: 36px;
            padding-block: 8px;
            font-size: 11px;
            line-height: 16px !important;
          }

          .prototypePage table td,
          .workflowPage table td,
          .p07Frame table td {
            min-height: 40px;
            padding-block: 10px;
            font-size: 12px;
            line-height: 20px !important;
          }

          .prototypePage .pageComposition button:not(.euiButton):not(.euiButtonEmpty):not(.euiTab),
          .workflowPage .workflowComposition button:not(.euiButton):not(.euiButtonEmpty):not(.euiTab) {
            font-size: 13px;
            line-height: 20px;
          }

          .prototypePage .euiButton[class*='fill-primary'],
          .workflowPage .euiButton[class*='fill-primary'] {
            border-color: var(--kbn-primary) !important;
            background-color: var(--kbn-primary) !important;
            color: #07101f !important;
            box-shadow: none !important;
          }

          .prototypePage .euiBadge,
          .workflowPage .euiBadge {
            display: inline-flex !important;
            width: fit-content !important;
            max-width: 100%;
            align-items: center;
            justify-self: start;
            white-space: normal;
          }

          .prototypePage .euiBadge[class*='euiBadge-success'],
          .workflowPage .euiBadge[class*='euiBadge-success'] {
            border-color: color-mix(in srgb, var(--kbn-success) 55%, var(--kbn-border)) !important;
            background-color: color-mix(in srgb, var(--kbn-success) 18%, var(--kbn-panel)) !important;
            color: #dffbf2 !important;
            box-shadow: none !important;
          }

          .prototypePage .euiBadge[class*='euiBadge-warning'],
          .workflowPage .euiBadge[class*='euiBadge-warning'] {
            border-color: color-mix(in srgb, var(--kbn-warning) 58%, var(--kbn-border)) !important;
            background-color: color-mix(in srgb, var(--kbn-warning) 16%, var(--kbn-panel)) !important;
            color: #fff0b3 !important;
            box-shadow: none !important;
          }

          .prototypePage .euiBadge[class*='euiBadge-danger'],
          .workflowPage .euiBadge[class*='euiBadge-danger'] {
            border-color: color-mix(in srgb, var(--kbn-danger) 58%, var(--kbn-border)) !important;
            background-color: color-mix(in srgb, var(--kbn-danger) 17%, var(--kbn-panel)) !important;
            color: #ffd8d5 !important;
            box-shadow: none !important;
          }

          .prototypePage .euiBadge[class*='euiBadge-primary'],
          .workflowPage .euiBadge[class*='euiBadge-primary'] {
            border-color: color-mix(in srgb, var(--kbn-primary) 58%, var(--kbn-border)) !important;
            background-color: color-mix(in srgb, var(--kbn-primary) 17%, var(--kbn-panel)) !important;
            color: #d8e9ff !important;
            box-shadow: none !important;
          }

          .prototypePage .euiBadge[class*='euiBadge-hollow'],
          .workflowPage .euiBadge[class*='euiBadge-hollow'] {
            border-color: var(--kbn-border-strong) !important;
            background-color: transparent !important;
            color: var(--kbn-text) !important;
            box-shadow: none !important;
          }

          /* P08 identity links own their wrapped two-line label instead of clipping it. */
          .page-p08 [data-visual-region='canonical-asset-inventory-grid'] .euiButtonEmpty {
            min-height: 36px;
            height: auto;
            align-items: flex-start;
            white-space: normal;
          }
          .page-p08 [data-visual-region='canonical-asset-inventory-grid'] .euiButtonEmpty__text {
            overflow: visible;
            line-height: 16px;
            white-space: normal;
          }

          /* P23 keeps the three-column workbench while making the session rail scan cleanly. */
          .page-p23 > .euiFlexGroup > .euiFlexItem { min-width: 0; }
          .page-p23 [data-visual-region='copilot-session-rail'] > button {
            display: grid;
            width: 100%;
            min-height: 68px;
            gap: 4px;
            padding: 8px 10px;
            border: 0;
            border-bottom: 1px solid var(--kbn-border);
            background: transparent;
            color: var(--kbn-text);
            text-align: left;
          }
          .page-p23 [data-visual-region='copilot-session-rail'] > button.selected {
            background: var(--kbn-primary-soft);
            box-shadow: inset 3px 0 0 var(--kbn-primary);
          }
          .page-p23 [data-visual-region='copilot-session-rail'] > button :is(strong, span, small) {
            display: block;
            min-width: 0;
            margin: 0;
            overflow-wrap: anywhere;
          }
          .page-p23 [data-visual-region='copilot-session-rail'] > button strong { line-height: 20px; }
          .page-p23 [data-visual-region='copilot-session-rail'] > button span { color: var(--kbn-text); line-height: 16px; }
          .page-p23 [data-visual-region='copilot-session-rail'] > button small { color: var(--kbn-muted); }

          /* P27 regression: the dependency map had no owned layout and collapsed every node. */
          .page-p27 .dependencyMap {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            min-width: 0;
          }
          .page-p27 .dependencyMap :is(.center, .node) {
            position: static !important;
            inset: auto !important;
            translate: none !important;
            width: auto !important;
            min-width: 0;
            max-width: none;
            padding: 8px 10px;
            border: 1px solid var(--kbn-border);
            border-radius: var(--kbn-radius);
            background: var(--kbn-panel-muted);
            overflow-wrap: anywhere;
          }
          .page-p27 .dependencyMap .center {
            grid-column: 1 / -1;
            justify-self: start;
            border-color: var(--kbn-primary);
            color: var(--kbn-heading);
            font-weight: 600;
          }
          .page-p27 .dependencyMap .node small { display: block; margin-top: 4px; color: var(--kbn-muted); }

          /* Dense registries own their horizontal table overflow instead of expanding adjacent panes. */
          .p37Layout > .euiPanel,
          .p41Workspace > .euiPanel { min-width: 0; }
          .p37Table,
          .p41Workspace > .euiPanel:first-child { overflow: hidden; }
          .p37TableWrap,
          .p41TableWrap { width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; }

          @media (max-width: 720px) {
            .page-p27 .dependencyMap { grid-template-columns: 1fr; }
          }

          /* EuiPageTemplate.Header renders an EuiPageHeader node rather than the legacy wrapper class. */
          .prototypePage [data-visual-region='page-header'],
          .workflowPage [data-visual-region='workflow-header'] {
            min-height: 80px !important;
            padding: 12px 20px !important;
          }
          .prototypePage [data-visual-region='page-header'] h1,
          .workflowPage [data-visual-region='workflow-header'] h1 {
            margin: 0 !important;
            font-size: 24px !important;
            line-height: 32px !important;
          }
          .prototypePage [data-visual-region='page-header'] [class*='description'],
          .workflowPage [data-visual-region='workflow-header'] [class*='description'] {
            margin: 4px 0 0 !important;
            font-size: 13px !important;
            line-height: 20px !important;
          }

          .prototypePage .euiBadge,
          .workflowPage .euiBadge {
            flex: 0 0 auto !important;
            min-width: 0 !important;
            width: max-content !important;
            max-width: 100% !important;
            inline-size: max-content !important;
            max-inline-size: 100% !important;
          }
          CSS
          git diff --check
          git diff --exit-code -- package-lock.json
          git diff --stat | tee /tmp/diff-stat.txt

      - name: Set up declared Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Set up declared npm version
        shell: bash
        run: npm install --global npm@10.9.2

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund | tee /tmp/npm-ci.log
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1

      - name: Run static validation
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee /tmp/lint.log
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          npm test 2>&1 | tee /tmp/test.log
          npm run build 2>&1 | tee /tmp/build.log

      - name: Run 1231x768 report-only audit
        shell: bash
        run: |
          set -euo pipefail
          VITE_ENABLE_FIXTURES=true npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5174/dashboard/soc >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5174/dashboard/soc >/dev/null
          EUI_AUDIT_WIDTH=1231 EUI_AUDIT_HEIGHT=768 node scripts/audit-eui-visual-metrics.mjs --report-only
          node - <<'NODE' | tee /tmp/audit-summary.txt
          const report = require('./artifacts/eui-visual-audit/report.json');
          console.log(JSON.stringify(report.summary, null, 2));
          NODE

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: eui-density-candidate-final
          path: |
            artifacts/eui-visual-audit/report.json
            artifacts/eui-visual-audit/report.md
            /tmp/diff-stat.txt
            /tmp/npm-ci.log
            /tmp/playwright-install.log
            /tmp/lint.log
            /tmp/typecheck.log
            /tmp/test.log
            /tmp/build.log
            /tmp/vite.log
            /tmp/audit-summary.txt
          if-no-files-found: error
          retention-days: 1
