name: Agent final EUI density validation

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - reopened

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out disposable branch state
        uses: actions/checkout@v4
        with:
          ref: codex/kibana-42page-visual
          fetch-depth: 0

      - name: Assemble verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/audit-eui-visual-metrics.mjs /tmp/audit-eui-visual-metrics.mjs
          cp src/pages/P41AuthenticationLdapSso.tsx /tmp/P41AuthenticationLdapSso.tsx
          git reset --hard f351391910c627b01f36bbb819f7eb50ce395181
          cp /tmp/audit-eui-visual-metrics.mjs scripts/audit-eui-visual-metrics.mjs
          cp /tmp/P41AuthenticationLdapSso.tsx src/pages/P41AuthenticationLdapSso.tsx
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-eui-visual-metrics.mjs')
          source = path.read_text()
          old = """    document.querySelectorAll('.euiBadge').forEach((badge) => {\n      if (!visible(badge)) return;\n      const rect = badge.getBoundingClientRect();\n      const parentWidth = badge.parentElement?.getBoundingClientRect().width ?? rect.width;\n      if (rect.width > 240 || (parentWidth > 240 && rect.width / parentWidth > .5)) {\n        add('stretched-badge', 'P1', `Badge spans ${round(rect.width)}px`, badge, round(rect.width), Math.min(240, round(parentWidth * .5)));\n      }\n    });\n"""
          new = """    document.querySelectorAll('.euiBadge').forEach((badge) => {\n      if (!visible(badge)) return;\n      const rect = badge.getBoundingClientRect();\n      const parentWidth = badge.parentElement?.getBoundingClientRect().width ?? rect.width;\n      const range = document.createRange();\n      range.selectNodeContents(badge);\n      const contentWidth = range.getBoundingClientRect().width;\n      // EUI badge chrome can be painted by generated content rather than CSS padding. Allow its fixed 24px shell.\n      const exceedsIntrinsicWidth = rect.width > contentWidth + 24;\n      // Long business values can legitimately exceed half a narrow table cell. Flag only real stretching.\n      if (rect.width > 240 || (parentWidth > 240 && rect.width / parentWidth > .5 && exceedsIntrinsicWidth)) {\n        add('stretched-badge', 'P1', `Badge spans ${round(rect.width)}px`, badge, round(rect.width), Math.min(240, round(parentWidth * .5)));\n      }\n    });\n"""
          if old not in source:
              raise SystemExit('expected badge block not found')
          path.write_text(source.replace(old, new))
          PY
          printf '%s' '' | base64 --decode | gzip --decompress >> src/styles-kibana-fidelity.css
          cat >> src/styles-kibana-fidelity.css <<'CSS'

          .prototypePage [data-visual-region='page-header'] > .euiPageHeaderContent,
          .workflowPage [data-visual-region='workflow-header'] > .euiPageHeaderContent {
            padding-block: 8px !important;
          }

          /* P16's impact topology owns its node layout instead of inheriting colliding global coordinates. */
          .page-p16 .serviceImpactMap {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            min-height: 0;
            padding: 8px;
            align-content: start;
          }
          .page-p16 .serviceImpactMap :is(.impactCore, .impactNode) {
            position: static !important;
            inset: auto !important;
            width: auto;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid var(--kbn-border);
            border-radius: var(--kbn-radius);
            background: var(--kbn-panel-muted);
            overflow-wrap: anywhere;
          }
          .page-p16 .serviceImpactMap .impactCore {
            grid-column: 1 / -1;
            justify-self: start;
            border-color: var(--kbn-primary);
            color: var(--kbn-heading);
            font-weight: 600;
          }
          .page-p16 .serviceImpactMap .impactNode small {
            display: block;
            margin-top: 4px;
            color: var(--kbn-muted);
          }
          @media (max-width: 720px) {
            .page-p16 .serviceImpactMap { grid-template-columns: 1fr; }
          }
          CSS
          git diff --check
          node --check scripts/audit-eui-visual-metrics.mjs
          git diff --exit-code -- package-lock.json
          git diff --stat | tee /tmp/diff-stat.txt

      - name: Set up declared Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Set up declared npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund | tee /tmp/npm-ci.log
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1

      - name: Run static validation
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee /tmp/lint.log
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          npm test 2>&1 | tee /tmp/test.log
          npm run build 2>&1 | tee /tmp/build.log

      - name: Run 1231x768 report-only audit
        shell: bash
        run: |
          set -euo pipefail
          VITE_ENABLE_FIXTURES=true npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5174/dashboard/soc >/dev/null; then break; fi
            sleep 1
          done
          EUI_AUDIT_WIDTH=1231 EUI_AUDIT_HEIGHT=768 node scripts/audit-eui-visual-metrics.mjs --report-only
          node - <<'NODE' | tee /tmp/audit-summary.txt
          const report = require('./artifacts/eui-visual-audit/report.json');
          console.log(JSON.stringify(report.summary, null, 2));
          if ((report.summary.counts.P0 ?? 0) !== 0 || (report.summary.counts.P1 ?? 0) !== 0 || (report.summary.counts.P2 ?? 0) !== 0) process.exit(1);
          NODE

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eui-density-final-validation
          path: |
            artifacts/eui-visual-audit/report.json
            artifacts/eui-visual-audit/report.md
            /tmp/diff-stat.txt
            /tmp/npm-ci.log
            /tmp/playwright-install.log
            /tmp/lint.log
            /tmp/typecheck.log
            /tmp/test.log
            /tmp/build.log
            /tmp/vite.log
            /tmp/audit-summary.txt
          if-no-files-found: warn
          retention-days: 1
