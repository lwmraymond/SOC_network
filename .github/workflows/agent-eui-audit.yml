name: Agent EUI metric diagnostic

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out disposable branch state
        uses: actions/checkout@v4
        with:
          ref: codex/kibana-42page-visual
          fetch-depth: 0

      - name: Assemble style candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard f351391910c627b01f36bbb819f7eb50ce395181
          printf '%s' '' | base64 --decode | gzip --decompress >> src/styles-kibana-fidelity.css

      - name: Set up Node and browser
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1

      - name: Capture computed metrics
        shell: bash
        run: |
          set -euo pipefail
          VITE_ENABLE_FIXTURES=true npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5174/dashboard/soc >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE' > /tmp/eui-diagnostic.json
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1231, height: 768 }, colorScheme: 'dark' });
          const page = await context.newPage();
          const style = (element) => {
            const computed = getComputedStyle(element);
            const rect = element.getBoundingClientRect();
            return {
              tag: element.tagName,
              className: element.className,
              text: element.textContent?.trim().slice(0, 160),
              rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height, bottom: rect.bottom },
              display: computed.display,
              position: computed.position,
              boxSizing: computed.boxSizing,
              height: computed.height,
              minHeight: computed.minHeight,
              maxHeight: computed.maxHeight,
              padding: computed.padding,
              paddingTop: computed.paddingTop,
              paddingBottom: computed.paddingBottom,
              margin: computed.margin,
              lineHeight: computed.lineHeight,
              fontSize: computed.fontSize,
              alignItems: computed.alignItems,
              justifyContent: computed.justifyContent,
              flex: computed.flex,
              width: computed.width,
              minWidth: computed.minWidth,
              maxWidth: computed.maxWidth,
              inlineSize: computed.inlineSize,
            };
          };
          await page.goto('http://127.0.0.1:5174/dashboard/soc', { waitUntil: 'networkidle' });
          await page.locator('[data-page-id="P01"]').waitFor();
          const header = await page.evaluate(() => {
            const root = document.querySelector('[data-visual-region="page-header"]');
            const description = root?.querySelector('[class*="description"], p');
            const walk = (element, depth = 0) => ({ style: globalThis.__style(element), children: depth < 4 ? [...element.children].map((child) => walk(child, depth + 1)) : [] });
            globalThis.__style = (element) => {
              const computed = getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return { tag: element.tagName, className: element.className, text: element.textContent?.trim().slice(0, 160), rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height, bottom: rect.bottom }, display: computed.display, position: computed.position, boxSizing: computed.boxSizing, height: computed.height, minHeight: computed.minHeight, maxHeight: computed.maxHeight, padding: computed.padding, paddingTop: computed.paddingTop, paddingBottom: computed.paddingBottom, margin: computed.margin, lineHeight: computed.lineHeight, fontSize: computed.fontSize, alignItems: computed.alignItems, justifyContent: computed.justifyContent, flex: computed.flex, width: computed.width, minWidth: computed.minWidth, maxWidth: computed.maxWidth, inlineSize: computed.inlineSize };
            };
            return { tree: walk(root), gapBelowDescription: root && description ? root.getBoundingClientRect().bottom - description.getBoundingClientRect().bottom : null, outerHTML: root?.outerHTML.slice(0, 10000) };
          });
          await page.goto('http://127.0.0.1:5174/itsm/approvals', { waitUntil: 'networkidle' });
          await page.locator('[data-page-id="P19"]').waitFor();
          const badges = await page.evaluate(() => [...document.querySelectorAll('[data-visual-region="approval-task-queue"] .euiBadge')].slice(0, 8).map((badge) => {
            const computed = getComputedStyle(badge);
            const rect = badge.getBoundingClientRect();
            const parent = badge.parentElement;
            const parentStyle = parent ? getComputedStyle(parent) : null;
            const parentRect = parent?.getBoundingClientRect();
            const range = document.createRange();
            range.selectNodeContents(badge);
            const contentRect = range.getBoundingClientRect();
            return { text: badge.textContent?.trim(), rect: { width: rect.width, height: rect.height }, contentRect: { width: contentRect.width, height: contentRect.height }, display: computed.display, width: computed.width, minWidth: computed.minWidth, maxWidth: computed.maxWidth, inlineSize: computed.inlineSize, flex: computed.flex, alignSelf: computed.alignSelf, justifySelf: computed.justifySelf, whiteSpace: computed.whiteSpace, parent: { tag: parent?.tagName, className: parent?.className, rect: parentRect ? { width: parentRect.width, height: parentRect.height } : null, display: parentStyle?.display, alignItems: parentStyle?.alignItems, justifyItems: parentStyle?.justifyItems } };
          }));
          console.log(JSON.stringify({ header, badges }, null, 2));
          await browser.close();
          NODE

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: eui-metric-diagnostic
          path: |
            /tmp/eui-diagnostic.json
            /tmp/vite.log
          if-no-files-found: error
          retention-days: 1
