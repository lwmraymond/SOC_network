name: Agent EUI assembly diagnostic

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out disposable branch state
        uses: actions/checkout@v4
        with:
          ref: codex/kibana-42page-visual
          fetch-depth: 0

      - name: Check staged audit syntax
        run: node --check scripts/audit-eui-visual-metrics.mjs

      - name: Save staged candidate files
        run: |
          cp scripts/audit-eui-visual-metrics.mjs /tmp/audit-eui-visual-metrics.mjs
          cp src/pages/P41AuthenticationLdapSso.tsx /tmp/P41AuthenticationLdapSso.tsx

      - name: Reset to verified source
        run: git reset --hard f351391910c627b01f36bbb819f7eb50ce395181

      - name: Restore candidate source files
        run: |
          cp /tmp/audit-eui-visual-metrics.mjs scripts/audit-eui-visual-metrics.mjs
          cp /tmp/P41AuthenticationLdapSso.tsx src/pages/P41AuthenticationLdapSso.tsx

      - name: Append candidate styles
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress >> src/styles-kibana-fidelity.css

      - name: Check candidate diff
        run: git diff --check

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Show candidate diff
        run: git diff --stat
