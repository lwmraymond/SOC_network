name: Temporary P01-P42 information-density measurement

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check final payload segments
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          for segment in 06 07; do
            curl --fail --silent --show-error --location "https://raw.githubusercontent.com/lwmraymond/SOC_network/${HEAD_SHA}/.density-audit-temp/payload-${segment}" > "/tmp/payload-${segment}"
            wc -c "/tmp/payload-${segment}"
            sha256sum "/tmp/payload-${segment}"
          done
          exit 1
