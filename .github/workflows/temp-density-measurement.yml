name: Temporary P01-P42 information-density measurement

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - reopened

permissions:
  contents: write

jobs:
  diagnose-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize verified collector
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          : > /tmp/information-density.b64
          for segment in 00 01 02 03 04 05 06 07; do
            curl --fail --silent --show-error --location "https://raw.githubusercontent.com/lwmraymond/SOC_network/${HEAD_SHA}/.density-audit-temp/payload-${segment}" >> /tmp/information-density.b64
          done
          base64 --decode /tmp/information-density.b64 | gzip --decompress > /tmp/audit-information-density.mjs
          test "$(sha256sum /tmp/audit-information-density.mjs | cut -d' ' -f1)" = "94213d25b758698a49a372fc61bdc6bb822c75bd47d12c6dc6ab877f6c7d7fc9"

      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/p01-p42-density-measurement-20260722
          fetch-depth: 1
          show-progress: false

      - name: Install collector and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cp /tmp/audit-information-density.mjs scripts/audit-information-density.mjs
          npm ci --no-audit --no-fund

      - name: Persist lint result
        shell: bash
        run: |
          set +e
          npm run lint > .density-audit-temp/lint-output.txt 2>&1
          status=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .density-audit-temp/lint-output.txt
          git commit -m 'chore: capture temporary density lint output [skip ci]'
          git push origin HEAD:codex/p01-p42-density-measurement-20260722
          exit "$status"
