name: Temporary P01-P42 information-density measurement

on:
  push:
    branches:
      - codex/p01-p42-density-measurement-20260722

permissions:
  contents: write

jobs:
  measure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated measurement branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize density collector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat .density-audit-temp/chunk-* | base64 --decode | gzip --decompress > scripts/audit-information-density.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-information-density.mjs')
          source = path.read_text()
          source = source.replace("const mean = (values) => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;\n", "")
          source = source.replace("const percentile = (values, proportion) => {\n  const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);\n  if (!sorted.length) return null;\n  const index = Math.max(0, Math.min(sorted.length - 1, Math.ceil(proportion * sorted.length) - 1));\n  return sorted[index];\n};\n", "")
          source = source.replace("        const clamp = (value, minimum = 0, maximum = 1) => Math.min(maximum, Math.max(minimum, value));\n", "")
          source = source.replace("        const overlaps = (first, second, tolerance = 0) => Math.min(first.right, second.right) - Math.max(first.left, second.left) > tolerance && Math.min(first.bottom, second.bottom) - Math.max(first.top, second.top) > tolerance;\n", "")
          path.write_text(source)
          PY
          node --check scripts/audit-information-density.mjs

      - name: Set up declared Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run static validation
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Render and measure all canonical pages
        shell: bash
        env:
          DENSITY_AUDIT_SOURCE_SHA: fa466957dbdc997f965e93d1b7ba709b33d5c197
          DENSITY_AUDIT_OUTPUT: docs/design/audit-2026-07-22/p01-p42-information-density.metrics.json
        run: |
          set -euo pipefail
          VITE_ENABLE_FIXTURES=true npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/density-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5174/dashboard/soc >/dev/null; then break; fi
            sleep 1
          done
          node scripts/audit-information-density.mjs
          node scripts/audit-information-density.mjs --validate-only docs/design/audit-2026-07-22/p01-p42-information-density.metrics.json
          git rev-parse 'fa466957dbdc997f965e93d1b7ba709b33d5c197^{tree}' > docs/design/audit-2026-07-22/source-tree-sha.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('docs/design/audit-2026-07-22/p01-p42-information-density.metrics.json', 'utf8'));
          const compact = {
            schemaVersion: report.schemaVersion,
            metricVersion: report.metricVersion,
            generatedAt: report.generatedAt,
            source: report.source,
            environment: report.environment,
            calibration: report.calibration,
            limitations: report.limitations,
            portfolio: report.portfolio,
            validation: report.validation,
            pages: report.pages.map((page) => ({
              id: page.id,
              title: page.title,
              route: page.route,
              sourceArchetype: page.sourceArchetype,
              archetype: page.archetype,
              scorable: page.scorable,
              confidence: page.confidence,
              priority: page.priority,
              failures: page.failures,
              scores: page.scores,
              primary: page.measurements.primary?.status === 'ok' ? {
                first_work_surface_y_ratio: page.measurements.primary.firstViewport.first_work_surface_y_ratio,
                meaningful_occupancy_ratio: page.measurements.primary.firstViewport.meaningful_occupancy_ratio,
                blank_canvas_ratio: page.measurements.primary.firstViewport.blank_canvas_ratio,
                text_chars_per_10k_px2: page.measurements.primary.firstViewport.text_chars_per_10k_px2,
                dom_block_count_per_100k_px2: page.measurements.primary.firstViewport.dom_block_count_per_100k_px2,
                top_level_group_count: page.measurements.primary.firstViewport.top_level_group_count,
                local_density_p95: page.measurements.primary.firstViewport.local_density_p95,
                hierarchy: page.measurements.primary.firstViewport.hierarchy,
                text: page.measurements.primary.firstViewport.text,
                interaction: page.measurements.primary.firstViewport.interaction,
                data_surfaces: page.measurements.primary.firstViewport.data_surfaces,
                document_horizontal_overflow_px: page.measurements.primary.firstViewport.document_horizontal_overflow_px,
                textSpacing: page.measurements.primary.textSpacing,
              } : null,
              structuralOverflow: page.measurements.structural?.firstViewport?.document_horizontal_overflow_px ?? null,
              tableOverflow: page.measurements.table?.firstViewport?.document_horizontal_overflow_px ?? null,
            })),
          };
          fs.writeFileSync('docs/design/audit-2026-07-22/compact-summary.json', JSON.stringify(compact, null, 2) + '\n');
          NODE

      - name: Publish measurement evidence on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .density-audit-temp .github/workflows/temp-density-measurement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A scripts/audit-information-density.mjs docs/design/audit-2026-07-22 .density-audit-temp .github/workflows/temp-density-measurement.yml
          git commit -m 'chore: capture temporary P01-P42 density evidence [skip ci]'
          git push origin HEAD:codex/p01-p42-density-measurement-20260722
