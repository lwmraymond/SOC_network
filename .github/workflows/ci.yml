name: Materialize Locally Validated Visual Recalculation Source

on:
  push:
    branches: [agent/page-differentiation-audit]

permissions:
  contents: write

jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, 'materialize:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/page-differentiation-audit
          fetch-depth: 0
      - name: Verify deterministic transport
        shell: bash
        run: |
          set -euo pipefail
          parts=(.transport/part-{000..020})
          test "${#parts[@]}" -eq 21
          for part in "${parts[@]}"; do test -f "$part"; done
          cat "${parts[@]}" > .transport/source.b64
          echo 'd8e6b2b1575a56888f0020b23d9ba300183efa5504a81c21c0d69d353376c04d  .transport/source.b64' | sha256sum -c -
          base64 --decode .transport/source.b64 > .transport/source.tar.xz
          echo 'f916580069dca97ec34256c3e95d8517831482308f44793669382700384ad24e  .transport/source.tar.xz' | sha256sum -c -
          xz -t .transport/source.tar.xz
      - name: Expand exact locally validated tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/validated-source"
          tar -xJf .transport/source.tar.xz -C "$RUNNER_TEMP/validated-source"
          test "$(find "$RUNNER_TEMP/validated-source/src/pages" -maxdepth 1 -name 'P*.tsx' | wc -l)" -eq 42
          test "$(find "$RUNNER_TEMP/validated-source/src/workflows" -maxdepth 1 -name 'H*.tsx' | wc -l)" -eq 19
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/validated-source/" ./
      - name: Commit real source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOC Platform Agent'
          git config user.email 'soc-platform-agent@users.noreply.github.com'
          git add -A
          git commit -m 'feat: sync latest visual recalculation source and evidence'
          git push origin HEAD:agent/page-differentiation-audit
