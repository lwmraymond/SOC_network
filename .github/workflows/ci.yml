name: Manual SOC ITSM Demo Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Production build and fixture boundary
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc-itsm-demo-browser-evidence
          retention-days: 30
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
