name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee unit-test-output.log
          test_status=${PIPESTATUS[0]}
          exit "$test_status"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-output
          path: unit-test-output.log

  p07-browser-gate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p07-visual-evidence
          path: |
            docs/soc-itsm-implementation/validation/screenshots/P07
            playwright-report
            test-results
