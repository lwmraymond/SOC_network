name: Export ITSM v2 source snapshot

on:
  push:
    branches:
      - agent/itsm-ticket-capability-framework-v2
    paths:
      - .github/workflows/agent-export-v2-source.yml
  pull_request:
    branches:
      - codex/p01-p42-density-fixes-20260723
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package working tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=soc-network-v2-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: soc-network-v2-source
          path: soc-network-v2-source.tar.gz
          retention-days: 1
          if-no-files-found: error
