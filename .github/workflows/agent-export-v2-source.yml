name: Export ITSM integration source snapshots

on:
  push:
    branches:
      - agent/itsm-ticket-capability-framework-v2
    paths:
      - .github/workflows/agent-export-v2-source.yml
  pull_request:
    branches:
      - codex/p01-p42-density-fixes-20260723
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out successor branch
        uses: actions/checkout@v4
        with:
          path: v2
          fetch-depth: 0
      - name: Check out PR 11 implementation snapshot
        uses: actions/checkout@v4
        with:
          ref: 1c567e74e5f40d4aeeca2690489a7ab7671cd1a4
          path: v1
          fetch-depth: 0
      - name: Package working trees
        shell: bash
        run: |
          set -euo pipefail
          git -C v2 archive --format=tar.gz --output=../soc-network-v2-source.tar.gz HEAD
          git -C v1 archive --format=tar.gz --output=../soc-network-v1-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: soc-network-integration-sources
          path: |
            soc-network-v2-source.tar.gz
            soc-network-v1-source.tar.gz
          retention-days: 1
          if-no-files-found: error
