name: Agent publish validated static patch

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out disposable validation ref
        uses: actions/checkout@v4
        with:
          ref: agent/gpt56-pro-elastic-eui-round2-validation-20260722
          fetch-depth: 0

      - name: Verify immutable source, candidate scope, and green matrix
        shell: bash
        run: |
          set -euo pipefail
          expected=40fe79035828a870a720d3ca858d8fd1bb9cc2ed
          git merge-base --is-ancestor "$expected" HEAD
          test "$(cat .agent-validation/lockfile_regeneration.status)" = "0"
          for name in npm_ci dependency_tree lint typecheck unit build playwright_install smoke routes; do
            test "$(cat ".agent-validation/final2/${name}.status")" = "0"
          done
          test "$(node -p "Object.keys(require('./package-lock.json').packages).length")" = "534"
          grep -Fq '.p36PortfolioRail{overflow:hidden}' src/components/page-specific/P36ResponseProjectsWorkspace.css
          ! grep -Fq 'max-height:420px' src/components/page-specific/P36ResponseProjectsWorkspace.css
          test "$(git diff --name-only "$expected" -- package.json)" = ""

      - name: Create and push one minimal commit to PR 6 branch
        shell: bash
        run: |
          set -euo pipefail
          expected=40fe79035828a870a720d3ca858d8fd1bb9cc2ed
          target=agent/gpt56-pro-elastic-eui-round2
          candidate=$(git rev-parse HEAD)
          files=(
            package-lock.json
            src/pages/P42ThemeAccessibility.tsx
            src/components/page-specific/P19ApprovalsTasksWorkspace.tsx
            src/components/page-specific/P31RuntimeObjectsWorkspace.tsx
            src/components/page-specific/P36ResponseProjectsWorkspace.tsx
            src/components/page-specific/P36ResponseProjectsWorkspace.css
            src/p07/EventSearchPage.tsx
          )

          git fetch origin "refs/heads/$target:refs/remotes/origin/$target"
          actual=$(git rev-parse "refs/remotes/origin/$target")
          test "$actual" = "$expected"

          git checkout --detach "$expected"
          git checkout "$candidate" -- "${files[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}"

          printf '%s\n' "${files[@]}" | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(node -p "Object.keys(require('./package-lock.json').packages).length")" = "534"
          grep -Fq '.p36PortfolioRail{overflow:hidden}' src/components/page-specific/P36ResponseProjectsWorkspace.css

          git commit -m "fix: restore static correctness and dependency lock"
          pushed=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$expected"
          git push origin "HEAD:refs/heads/$target"
          printf 'PUSHED_COMMIT=%s\n' "$pushed"
