name: Agent P36 DOM metrics

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out disposable validation ref
        uses: actions/checkout@v4
        with:
          ref: agent/gpt56-pro-elastic-eui-round2-validation-20260722
          fetch-depth: 0

      - name: Set up declared Node and npm versions
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          rm -rf node_modules
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture computed P36 layout metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-validation/diagnostic
          VITE_ENABLE_FIXTURES=true npm run dev -- --host 127.0.0.1 --port 4173 > .agent-validation/diagnostic/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/projects/responses >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/projects/responses >/dev/null
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          await page.goto('http://127.0.0.1:4173/projects/responses');
          await page.locator('[data-page-id="P36"][data-fixture-ready="true"]').waitFor();
          await page.locator('.p36Projects').waitFor();
          await page.waitForTimeout(250);
          const metrics = await page.evaluate(() => {
            const read = (selector) => {
              const element = document.querySelector(selector);
              if (!(element instanceof HTMLElement)) return null;
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                selector,
                tag: element.tagName,
                className: element.className,
                top: rect.top,
                bottom: rect.bottom,
                height: rect.height,
                width: rect.width,
                clientHeight: element.clientHeight,
                scrollHeight: element.scrollHeight,
                offsetHeight: element.offsetHeight,
                display: style.display,
                position: style.position,
                maxHeight: style.maxHeight,
                minHeight: style.minHeight,
                overflowY: style.overflowY,
                marginTop: style.marginTop,
                marginBottom: style.marginBottom,
                paddingTop: style.paddingTop,
                paddingBottom: style.paddingBottom,
                gap: style.gap,
                rowGap: style.rowGap,
              };
            };
            const selectors = [
              'body',
              '.appShell',
              '.sidebar',
              '.content',
              '.prototypePage',
              '[data-visual-region="page-header"]',
              '.prototypePage > section',
              '.pageContextPanel',
              '.pageFrameContent',
              '.p36Projects',
              '.p36ScopePanel',
              '.p36Workspace',
              '.p36PortfolioRail',
              '.p36ProjectList',
              '.p36PrimaryWorkspace',
              '.p36PortfolioSummary',
            ];
            return {
              viewport: { width: innerWidth, height: innerHeight },
              document: {
                scrollHeight: document.documentElement.scrollHeight,
                clientHeight: document.documentElement.clientHeight,
                bodyScrollHeight: document.body.scrollHeight,
              },
              media: {
                constrained: matchMedia('(max-height:720px) and (min-width:821px)').matches,
                narrow: matchMedia('(max-width:820px)').matches,
              },
              pageMode: document.querySelector('.pageFrameContent')?.getAttribute('data-page-mode'),
              elements: Object.fromEntries(selectors.map((selector) => [selector, read(selector)])),
              projectChildren: Array.from(document.querySelector('.p36Projects')?.children ?? []).map((element) => {
                const rect = element.getBoundingClientRect();
                return { tag: element.tagName, className: element.className, top: rect.top, bottom: rect.bottom, height: rect.height };
              }),
              workspaceChildren: Array.from(document.querySelector('.p36Workspace')?.children ?? []).map((element) => {
                const rect = element.getBoundingClientRect();
                return { tag: element.tagName, className: element.className, top: rect.top, bottom: rect.bottom, height: rect.height };
              }),
            };
          });
          fs.writeFileSync('.agent-validation/diagnostic/p36-metrics.json', `${JSON.stringify(metrics, null, 2)}\n`);
          await browser.close();
          JS

      - name: Commit diagnostic evidence to disposable ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-validation/diagnostic
          git commit -m "test: capture P36 computed layout metrics"
          git push origin HEAD:agent/gpt56-pro-elastic-eui-round2-validation-20260722
