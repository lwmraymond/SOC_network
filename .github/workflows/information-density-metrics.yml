name: P01-P42 information-density metrics

on:
  pull_request:
    branches:
      - codex/merge-p01-p35-eui
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  measure:
    if: github.head_ref == 'codex/p01-p42-information-density-audit-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out measurement branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and collector scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD fa466957dbdc997f965e93d1b7ba709b33d5c197)" = "fa466957dbdc997f965e93d1b7ba709b33d5c197"
          git diff --exit-code fa466957dbdc997f965e93d1b7ba709b33d5c197 -- \
            src package.json package-lock.json vite.config.ts playwright.config.ts \
            tests/e2e/canonicalRoutes.ts
          node --check scripts/audit-information-density.mjs

      - name: Set up declared Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install declared npm and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Validate collector and application
        shell: bash
        run: |
          set -euo pipefail
          npx eslint scripts/audit-information-density.mjs
          npm run typecheck

      - name: Measure all routes at all audit viewports
        shell: bash
        env:
          AUDIT_SOURCE_SHA: fa466957dbdc997f965e93d1b7ba709b33d5c197
          VITE_ENABLE_FIXTURES: 'true'
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/information-density-metrics-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5174/dashboard/soc >/dev/null; then break; fi
            if [ "$attempt" -eq 90 ]; then
              cat /tmp/information-density-metrics-vite.log
              exit 1
            fi
            sleep 1
          done
          node scripts/audit-information-density.mjs
          node - <<'NODE'
          const data = require('./docs/design/audit-2026-07-22/information-density-metrics.raw.json');
          if (data.validation.measuredPrimaryPages !== 42 || data.validation.measuredStructuralPages !== 42 || data.validation.measuredTablePages !== 42 || data.validation.renderFailureCount !== 0) {
            console.error(JSON.stringify(data.validation, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify(data.validation, null, 2));
          NODE

      - name: Upload raw metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: information-density-metrics-fa466957
          path: |
            docs/design/audit-2026-07-22/information-density-metrics.raw.json
            /tmp/information-density-metrics-vite.log
          if-no-files-found: error
          retention-days: 7
