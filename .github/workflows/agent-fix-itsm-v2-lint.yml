name: Apply exact ITSM v2 lint corrections

on:
  pull_request:
    branches:
      - codex/p01-p42-density-fixes-20260723
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: agent/itsm-ticket-capability-framework-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/itsm-ticket-capability-framework-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci --no-audit --no-fund
      - name: Apply exact source corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, found {count}')
              file.write_text(text.replace(old, new))

          replace_once(
              'src/components/page-specific/P16IncidentManagementWorkspace.tsx',
              "  const [selectedId, setSelectedId] = useState<string | undefined>(undefined);\n",
              '',
          )
          replace_once(
              'src/components/page-specific/P16IncidentManagementWorkspace.tsx',
              "  const selected = visible.find((item) => item.id === selectedId) ?? visible[0] ?? incidents[0];\n",
              "  const selected = visible[0] ?? incidents[0];\n",
          )

          for path in ('src/itsm/client.ts', 'src/itsm/httpAdapter.ts'):
              for line in (
                  '  CommentCreateInput,\n',
                  '  TicketCreateInput,\n',
                  '  TicketPatch,\n',
              ):
                  replace_once(path, line, '')

          replace_once(
              'src/itsm/components/TicketConversation.tsx',
              "import { ItsmTabs } from './ItsmTabs';\n\nconst mentionPattern = /@([\\w-]+)/g;\n\nexport function extractMentions(body: string): string[] {\n  return Array.from(new Set(Array.from(body.matchAll(mentionPattern)).map((match) => match[1])));\n}\n",
              "import { ItsmTabs } from './ItsmTabs';\nimport { extractMentions } from '../presentation';\n",
          )

          replace_once(
              'src/itsm/components/TicketOverview.tsx',
              "import type { Ticket, TicketBundle } from '../contracts';\n\nexport function ticketKindLabel(ticket: Ticket): string {\n  return ticket.kind === 'request' ? 'Service request' : `${ticket.kind[0].toUpperCase()}${ticket.kind.slice(1)}`;\n}\n",
              "import type { TicketBundle } from '../contracts';\nimport { ticketKindLabel } from '../presentation';\n",
          )

          replace_once(
              'src/pages/itsm/ItsmTicketDetailPage.tsx',
              "import { TicketOverview, ticketKindLabel } from '../../itsm/components/TicketOverview';\n",
              "import { TicketOverview } from '../../itsm/components/TicketOverview';\nimport { ticketKindLabel } from '../../itsm/presentation';\n",
          )

          presentation = Path('src/itsm/presentation.ts')
          if presentation.exists():
              raise SystemExit('src/itsm/presentation.ts already exists')
          presentation.write_text("""import type { Ticket } from './contracts';\n\nconst mentionPattern = /@([\\w-]+)/g;\n\nexport function extractMentions(body: string): string[] {\n  return Array.from(new Set(Array.from(body.matchAll(mentionPattern)).map((match) => match[1])));\n}\n\nexport function ticketKindLabel(ticket: Ticket): string {\n  return ticket.kind === 'request' ? 'Service request' : `${ticket.kind[0].toUpperCase()}${ticket.kind.slice(1)}`;\n}\n""")
      - name: Verify correction
        run: |
          git diff --check
          npm run lint
          npm run typecheck
      - name: Commit and push source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/page-specific/P16IncidentManagementWorkspace.tsx src/itsm src/pages/itsm/ItsmTicketDetailPage.tsx
          git commit -m "fix: resolve ITSM v2 lint findings"
          git push origin "HEAD:${TARGET_BRANCH}"
